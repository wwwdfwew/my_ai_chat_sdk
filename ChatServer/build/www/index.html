<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI聊天助手</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/styles/github-dark.min.css">
    <script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/lib/highlight.min.js"></script>
</head>
<body>
    <div class="app-container">
        <!-- 左侧边栏 -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <div class="brand">
                    <div class="brand-icon" aria-hidden="true">
                        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M12 2a10 10 0 1 0 10 10c0-2-.5-4-2-6-.5.3-1 .5-2 .5a4 4 0 0 0-4-4c0-1 .2-1.5.5-2-2-.5-4-.5-6 0 .3.5.5 1 .5 2a4 4 0 0 0-4 4c-1 0-1.5-.2-2-.5-2 2-4 4-4 6z"/>
                            <circle cx="8.5" cy="11.5" r="1"/>
                            <circle cx="15.5" cy="11.5" r="1"/>
                            <path d="M9 15.5c1 1 2 1.5 3 1.5s2-.5 3-1.5"/>
                        </svg>
                    </div>
                    <span class="brand-name">AI聊天助手</span>
                </div>
                <button class="btn btn-primary btn-new-chat-top" id="btnNewChatTop">
                    <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="12" y1="5" x2="12" y2="19"></line>
                        <line x1="5" y1="12" x2="19" y2="12"></line>
                    </svg>
                    <span>新建对话</span>
                </button>
            </div>
            <div class="session-list" id="sessionList"></div>
        </aside>

        <!-- 右侧主区域 -->
        <main class="main-area">
            <!-- 欢迎视图 -->
            <div class="welcome-view" id="welcomeView">
                <div class="welcome-icon" aria-hidden="true">
                    <svg viewBox="0 0 24 24" width="64" height="64" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
                        <path d="M8 10h.01"/>
                        <path d="M12 10h.01"/>
                        <path d="M16 10h.01"/>
                    </svg>
                </div>
                <p class="welcome-text">选择一个历史对话继续，或创建新的对话，开启您的AI之旅</p>
                <button class="btn btn-primary btn-new-chat-welcome" id="btnNewChatWelcome">
                    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="12" y1="5" x2="12" y2="19"></line>
                        <line x1="5" y1="12" x2="19" y2="12"></line>
                    </svg>
                    <span>新建对话</span>
                </button>
            </div>

            <!-- 聊天视图 -->
            <div class="chat-view" id="chatView" style="display:none;">
                <div class="chat-header">
                    <span class="chat-model-name" id="chatModelName"></span>
                </div>
                <div class="chat-messages" id="chatMessages"></div>
                <div class="chat-input-area">
                    <div class="input-wrapper">
                        <textarea
                            id="messageInput"
                            class="message-input"
                            placeholder="请输入您的消息...(Enter发送，Shift+Enter换行)"
                            maxlength="2000"
                            rows="1"
                        ></textarea>
                        <button class="btn btn-send" id="btnSend" disabled aria-label="发送">
                            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <line x1="22" y1="2" x2="11" y2="13"></line>
                                <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
                            </svg>
                        </button>
                    </div>
                    <div class="input-counter">
                        <span id="charCount">0</span>/2000
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- 模型选择弹窗（无边框卡片） -->
    <div class="modal-overlay" id="modelModal">
        <div class="modal-card">
            <h3 class="modal-title">选择模型</h3>
            <div class="model-grid" id="modelGrid"></div>
            <div class="modal-actions">
                <button class="btn btn-ghost" id="btnCancelModel">取消</button>
                <button class="btn btn-primary" id="btnConfirmModel" disabled>确定</button>
            </div>
        </div>
    </div>

    <!-- 会话右键/下拉菜单 -->
    <div class="context-menu" id="contextMenu">
        <button class="context-menu-item" id="menuDelete">
            <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="3 6 5 6 21 6"></polyline>
                <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
            </svg>
            <span>删除会话</span>
        </button>
    </div>

    <!-- Toast 提示 -->
    <div class="toast" id="toast"></div>

    <script src="app.js"></script>
</body>
</html>
